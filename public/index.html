<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospera - Gestão Financeira</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h2>Prospera</h2>
      </div>

      <!-- SESSÃO DE LOGIN -->
      <div id="login-section">
        <form id="login-form">
          <div class="form-group">
            <input type="email" id="login-email" placeholder="E-mail" required>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder="Senha" required>
          </div>
          <button type="submit" class="btn">Entrar</button>
        </form>
        <p class="toggle-text">
          Não tem conta? <button type="button" class="btn-link" onclick="alternarAcao()">Cadastre-se</button>
        </p>
      </div>

      <!-- SESSÃO DE CADASTRO -->
      <div id="register-section" style="display: none;">
        <form id="register-form">
          <div class="form-group">
            <input type="text" id="name" placeholder="Nome completo" required>
          </div>
          <div class="form-group">
            <input type="email" id="email" placeholder="E-mail" required>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="Senha" required>
          </div>
          <button type="submit" class="btn">Criar Conta</button>
        </form>
        <p class="toggle-text">
          Já tem conta? <button type="button" class="btn-link" onclick="alternarAcao()">Fazer Login</button>
        </p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
