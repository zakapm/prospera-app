<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospera - Gestão Financeira</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <!-- TELA DE AUTENTICAÇÃO -->
    <div class="card" id="auth-card">
      <div class="logo">
        <h2>Prospera</h2>
      </div>

      <!-- SESSÃO DE LOGIN -->
      <div id="login-section">
        <form id="login-form">
          <div class="form-group">
            <input type="email" id="login-email" placeholder="E-mail" required>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder="Senha" required>
          </div>
          <button type="submit" class="btn">Entrar</button>
        </form>
        <p class="toggle-text">
          Não tem conta? <button type="button" class="btn-link" onclick="alternarAcao()">Cadastre-se</button>
        </p>
      </div>

      <!-- SESSÃO DE CADASTRO -->
      <div id="register-section" style="display: none;">
        <form id="register-form">
          <div class="form-group">
            <input type="text" id="name" placeholder="Nome completo" required>
          </div>
          <div class="form-group">
            <input type="email" id="email" placeholder="E-mail" required>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="Senha" required>
          </div>
          <button type="submit" class="btn">Criar Conta</button>
        </form>
        <p class="toggle-text">
          Já tem conta? <button type="button" class="btn-link" onclick="alternarAcao()">Fazer Login</button>
        </p>
      </div>
    </div>

    <!-- TELA PRINCIPAL (PAINEL FINANCEIRO) -->
    <div id="dashboard-section" class="dashboard-container" style="display: none;">
      <header class="header-dashboard">
        <div>
          <h2 id="welcome-message">Bem-vindo, Utilizador!</h2>
          <p class="subtitle">Gestão Financeira Pessoal</p>
        </div>
        <button id="logout-btn" class="btn-logout" onclick="fazerLogout()">Sair</button>
      </header>

      <!-- RESUMO FINANCEIRO -->
      <section class="cards-summary">
        <div class="summary-card balance">
          <h3>Saldo Atual</h3>
          <p id="total-balance">R$ 0,00</p>
        </div>
        <div class="summary-card income">
          <h3>Receitas</h3>
          <p id="total-income">R$ 0,00</p>
        </div>
        <div class="summary-card expense">
          <h3>Despesas</h3>
          <p id="total-expense">R$ 0,00</p>
        </div>
      </section>

      <!-- FORMULÁRIO DE NOVO LANÇAMENTO -->
      <section class="card form-card">
        <h3>Novo Lançamento</h3>
        <form id="transaction-form">
          <div class="form-row">
            <input type="text" id="trans-desc" placeholder="Descrição (ex: Mercado, Salário)" required>
            <input type="number" id="trans-amount" step="0.01" placeholder="Valor (R$)" required>
            <select id="trans-type">
              <option value="income">Receita (+)</option>
              <option value="expense">Despesa (-)</option>
            </select>
            <button type="submit" class="btn">Adicionar</button>
          </div>
        </form>
      </section>

      <!-- LISTA DE TRANSAÇÕES -->
      <section class="card list-card">
        <h3>Histórico de Lançamentos</h3>
        <ul id="transactions-list" class="transactions-list">
          <li class="empty-msg">Nenhum lançamento registado ainda.</li>
        </ul>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
